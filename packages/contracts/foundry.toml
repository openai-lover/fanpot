[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "../../node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = ["@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/", "forge-std/=lib/forge-std/src/"]
bytecode_hash = "ipfs"
build_info = true

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false
