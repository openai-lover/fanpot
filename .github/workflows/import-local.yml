name: Import local FanPot source

on:
  push:
    paths:
      - .github/workflows/import-local.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import source files
        env:
          EXPECTED_COMMIT: 3b79084dd6de14c460a9b3b35359d2630e7fc081
        run: |
          git bundle verify fanpot.bundle
          git fetch fanpot.bundle refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_COMMIT"
          git archive "$EXPECTED_COMMIT" | tar -xf -
          git add -A
          git reset -q HEAD -- .github/workflows/ci.yml
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "feat: import FanPot source"
          git push origin HEAD:main
