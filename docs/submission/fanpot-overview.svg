<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><rect x="0" y="0" width="1440" height="960" rx="0" fill="#f7f9f5" stroke="none"/><text x="68" y="69" font-family="Helvetica Neue,Arial,sans-serif" font-size="34" font-weight="700" fill="#182320">fanpot</text><text x="1140" y="67" font-family="Helvetica Neue,Arial,sans-serif" font-size="17" font-weight="500" fill="#5f7169">01 / THE PRODUCT</text><text x="68" y="164" font-family="Helvetica Neue,Arial,sans-serif" font-size="62" font-weight="600" fill="#182320">Fan love. Clear money rules.</text><text x="70" y="216" font-family="Helvetica Neue,Arial,sans-serif" font-size="29" font-weight="400" fill="#5f7169">K-pop campaign funding with USDC escrow on Arc.</text><path d="M68 258 L1372 258" fill="none" stroke="#d6e0d9" stroke-width="2"/><text x="70" y="311" font-family="Helvetica Neue,Arial,sans-serif" font-size="19" font-weight="600" fill="#236850">BIRTHDAY ADS  /  FAN GOODS  /  COMMUNITY EVENTS</text><text x="70" y="393" font-family="Helvetica Neue,Arial,sans-serif" font-size="35" font-weight="600" fill="#182320">Fans</text><text x="70" y="435" font-family="Helvetica Neue,Arial,sans-serif" font-size="24" font-weight="400" fill="#5f7169">Contribute USDC</text><path d="M267 410 H347 m-10 -7 10 7 -10 7" fill="none" stroke="#236850" stroke-width="3"/><rect x="376" y="346" width="385" height="225" rx="16" fill="#e7efe7" stroke="none"/><text x="406" y="393" font-family="Helvetica Neue,Arial,sans-serif" font-size="35" font-weight="600" fill="#182320">Campaign escrow</text><text x="407" y="438" font-family="Helvetica Neue,Arial,sans-serif" font-size="25" font-weight="500" fill="#236850">Recipients + payout caps</text><text x="407" y="477" font-family="Helvetica Neue,Arial,sans-serif" font-size="23" font-weight="400" fill="#5f7169">Fixed before funding begins</text><text x="407" y="536" font-family="Helvetica Neue,Arial,sans-serif" font-size="21" font-weight="400" fill="#5f7169">No organizer withdrawal switch</text><path d="M789 410 H864 m-10 -7 10 7 -10 7" fill="none" stroke="#236850" stroke-width="3"/><text x="896" y="393" font-family="Helvetica Neue,Arial,sans-serif" font-size="35" font-weight="600" fill="#182320">Recipient</text><text x="896" y="436" font-family="Helvetica Neue,Arial,sans-serif" font-size="24" font-weight="400" fill="#5f7169">Paid within the fixed cap</text><text x="896" y="486" font-family="Helvetica Neue,Arial,sans-serif" font-size="25" font-weight="600" fill="#236850">After reviewer approval</text><text x="896" y="523" font-family="Helvetica Neue,Arial,sans-serif" font-size="23" font-weight="400" fill="#5f7169">of amount + evidence hash</text><path d="M568 571 V624 H168 V487 m-7 10 7 -10 7 10" fill="none" stroke="#236850" stroke-width="2"/><text x="286" y="662" font-family="Helvetica Neue,Arial,sans-serif" font-size="25" font-weight="500" fill="#236850">Eligible refunds return to supporters</text><text x="286" y="698" font-family="Helvetica Neue,Arial,sans-serif" font-size="21" font-weight="400" fill="#5f7169">Claimable when funding fails or funds remain after settlement.</text><rect x="68" y="757" width="1304" height="121" rx="14" fill="#182320" stroke="none"/><text x="99" y="801" font-family="Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="600" fill="#a7c5b4">WHY ARC</text><text x="99" y="845" font-family="Helvetica Neue,Arial,sans-serif" font-size="33" font-weight="500" fill="#ffffff">USDC for contributions, payouts, refunds — and gas.</text><text x="70" y="922" font-family="Helvetica Neue,Arial,sans-serif" font-size="19" font-weight="400" fill="#5f7169">Contract rules govern money movement; offchain delivery still requires a trusted review.</text></svg>