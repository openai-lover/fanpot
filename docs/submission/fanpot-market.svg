<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050"><rect x="0" y="0" width="1440" height="1050" rx="0" fill="#f7f9f5" stroke="none"/><text x="68" y="69" font-family="Helvetica Neue,Arial,sans-serif" font-size="34" font-weight="700" fill="#182320">fanpot</text><text x="1140" y="67" font-family="Helvetica Neue,Arial,sans-serif" font-size="17" font-weight="500" fill="#5f7169">02 / THE OPPORTUNITY</text><text x="68" y="164" font-family="Helvetica Neue,Arial,sans-serif" font-size="58" font-weight="600" fill="#182320">Fandom already crosses borders.</text><text x="70" y="215" font-family="Helvetica Neue,Arial,sans-serif" font-size="28" font-weight="400" fill="#5f7169">Start with a recurring ritual: the fan-funded birthday ad.</text><path d="M68 258 L1372 258" fill="none" stroke="#d6e0d9" stroke-width="2"/><text x="70" y="367" font-family="Helvetica Neue,Arial,sans-serif" font-size="78" font-weight="600" fill="#182320">225M</text><text x="70" y="411" font-family="Helvetica Neue,Arial,sans-serif" font-size="25" font-weight="500" fill="#182320">Reported Hallyu fans</text><text x="70" y="452" font-family="Helvetica Neue,Arial,sans-serif" font-size="21" font-weight="400" fill="#5f7169">2023 · broader Korean culture</text><text x="70" y="487" font-family="Helvetica Neue,Arial,sans-serif" font-size="19" font-weight="400" fill="#5f7169">Korea Foundation / Korea.net [1]</text><path d="M494 310 L494 507" fill="none" stroke="#d6e0d9" stroke-width="2"/><text x="544" y="367" font-family="Helvetica Neue,Arial,sans-serif" font-size="73" font-weight="600" fill="#182320">~$120M</text><text x="544" y="411" font-family="Helvetica Neue,Arial,sans-serif" font-size="25" font-weight="500" fill="#182320">Korean CD exports</text><text x="544" y="452" font-family="Helvetica Neue,Arial,sans-serif" font-size="21" font-weight="400" fill="#5f7169">Q1 2026 · physical albums</text><text x="544" y="487" font-family="Helvetica Neue,Arial,sans-serif" font-size="19" font-weight="400" fill="#5f7169">Korea Customs Service [2]</text><path d="M961 310 L961 507" fill="none" stroke="#d6e0d9" stroke-width="2"/><text x="1010" y="367" font-family="Helvetica Neue,Arial,sans-serif" font-size="78" font-weight="600" fill="#182320">131</text><text x="1010" y="411" font-family="Helvetica Neue,Arial,sans-serif" font-size="25" font-weight="500" fill="#182320">Export destinations</text><text x="1010" y="452" font-family="Helvetica Neue,Arial,sans-serif" font-size="21" font-weight="400" fill="#5f7169">Q1 2026 · Korean CDs</text><text x="1010" y="487" font-family="Helvetica Neue,Arial,sans-serif" font-size="19" font-weight="400" fill="#5f7169">Korea Customs Service [2]</text><text x="70" y="555" font-family="Helvetica Neue,Arial,sans-serif" font-size="21" font-weight="400" fill="#5f7169">Audience and spending signals; these figures are not a fan-ad market-size estimate.</text><path d="M68 596 L1372 596" fill="none" stroke="#d6e0d9" stroke-width="2"/><text x="70" y="648" font-family="Helvetica Neue,Arial,sans-serif" font-size="19" font-weight="600" fill="#236850">WHERE FANPOT FITS</text><text x="70" y="707" font-family="Helvetica Neue,Arial,sans-serif" font-size="28" font-weight="600" fill="#182320">FanPlus</text><text x="388" y="707" font-family="Helvetica Neue,Arial,sans-serif" font-size="27" font-weight="400" fill="#5f7169">Fan voting → advertising rewards [3]</text><path d="M68 737 L1372 737" fill="none" stroke="#d6e0d9" stroke-width="2"/><text x="70" y="786" font-family="Helvetica Neue,Arial,sans-serif" font-size="28" font-weight="600" fill="#182320">MAKESTAR</text><text x="388" y="786" font-family="Helvetica Neue,Arial,sans-serif" font-size="25" font-weight="400" fill="#5f7169">Reward crowdfunding → platform funding &amp; refunds [4]</text><rect x="68" y="818" width="1304" height="113" rx="12" fill="#e7efe7" stroke="none"/><text x="95" y="863" font-family="Helvetica Neue,Arial,sans-serif" font-size="30" font-weight="600" fill="#236850">FanPot</text><text x="389" y="863" font-family="Helvetica Neue,Arial,sans-serif" font-size="25" font-weight="500" fill="#236850">Fan-organized funding → contract-enforced spending rules</text><text x="389" y="902" font-family="Helvetica Neue,Arial,sans-serif" font-size="20" font-weight="400" fill="#5f7169">Fixed recipient · capped payout · reviewer approval · onchain receipts</text><text x="70" y="984" font-family="Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#5f7169">Sources [1–4] are linked in the accompanying description. Comparison covers the stated workflows.</text><text x="70" y="1015" font-family="Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#5f7169">FanPot is an early Mainnet proof. Existing services also provide their own safeguards and refund policies.</text></svg>